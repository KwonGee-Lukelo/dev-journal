<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <title>devJouranl | note</title>
  </head>

  <body>
    <header>
      <nav>
        <div class="logo">
          <a href="#" aria-label="Logo">devJournal</a>
        </div>

        <div class="nav__links">
          <ul class="nav__menu" id="menu">
            <li>
              <a href="#" class="link active">
                <i class="ri-dashboard-line" aria-hidden="true"></i>
                Tableau de bord
              </a>
            </li>

            <li>
              <a href="#" class="link">
                <i class="ri-draft-line" aria-hidden="true"></i>
                Notes
              </a>
            </li>

            <li>
              <a href="#" class="btn__login btn__login--mobile">
                Se connecter
              </a>
            </li>
          </ul>
        </div>

        <div class="nav__actions">
          <a href="#" class="btn__login" id="nav__btn"> Se connecter </a>
          <i class="ri-menu-3-line" id="menu__icon" aria-hidden="true"></i>
          <i class="ri-close-fill" id="close__icon" aria-hidden="true"></i>
        </div>
      </nav>
    </header>

    <main class="container">
      <section class="entete">
        <figure>
          <figcaption>Ajouter la note technique</figcaption>
          <p>Documentez les spécifactions de la notion</p>
        </figure>
      </section>

      <section class="formulaire">
        <form action="" method="post">
          <div class="groupe_1">
            <label for="titre">Titre de la note</label>
            <input type="text" name="titre" required />
          </div>

          <div class="groupe_2">
            <div>
              <label for="techno">Technologie/stack</label>
              <input type="text" name="techno" required />
            </div>

            <div>
              <label for="status">Status</label>
              <select name="status" required>
                <option value="choisir status">----</option>
                <option value="arevoir">A revoir</option>
                <option value="maitriser">Maitriser</option>
              </select>
            </div>

            <div>
              <label for="complex">Niveau de complexité</label>
              <select name="complex" required>
                <option value="choisir niveau">----</option>
                <option value="debutant">débutant</option>
                <option value="intermediaire">Intermediaire</option>
                <option value="avance">Avancé</option>
              </select>
            </div>
          </div>

          <div class="groupe_3">
            <label for="extrait">Extrait de code</label>
            <textarea name="extrait" cols="30" rows="15" required></textarea>
          </div>

          <div class="groupe_4">
            <label for="com">Commentaire</label>
            <textarea name="com" cols="30" rows="10"></textarea>
          </div>

          <div class="groupe_btn">
            <input type="reset" class="btn_reset" value="Réinitialiser" />
            <input
              type="submit"
              class="btn_submit"
              value="Enregister la note"
            />
          </div>
        </form>
      </section>
    </main>
    <footer></footer>

    <script src="../js/app.js"></script>
  </body>
</html>
